name: Lint workflows

# 6 リポジトリ（home-cluster / home-infra / home-cloudflare / home-harbor /
# home-trading / home-rss）で同じ lint を回していたものを 1 箇所に寄せたもの。
#
# 寄せた理由は PR の数ではなく **drift**。抽出前の時点で actionlint が 4 通り、
# zizmor が 4 通りに分かれており、kubeconform に至ってはバージョンが
# v0.7.0 と v0.8.0 で割れていた。ツールのピンが 6 箇所にあると必ずこうなる。
#
# 呼び出し側は必須チェックを `CI Gate` 1 個に集約していること。
# ジョブ名を個別に必須化していると、ここで名前を変えた瞬間に
# 全 PR が "Waiting for status to be reported" で止まる。
on:
  workflow_call:
    inputs:
      aqua-version:
        type: string
        # renovate: datasource=github-releases depName=aquaproj/aqua
        default: v2.62.3
      zizmor-version:
        description: >
          zizmor-action の support/versions に載っている版しか使えない。
          action の digest 更新と同じ PR で動かすこと（別々に上げると
          "Unknown version" で落ちる）。
        type: string
        # renovate: datasource=github-releases depName=zizmorcore/zizmor
        default: "1.30.0"

permissions: {}

jobs:
  actionlint:
    # Named so this repository passes the pedantic level it imposes on its
    # callers; the string matches the job id, so the check name callers see is
    # unchanged.
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      # ツールのピンは呼び出し側ではなくここのものを使う。下の sparse-checkout で
      # 取ってくる aqua.yaml を指す。
      AQUA_CONFIG: _tooling/aqua.yaml
    steps:
      - name: Checkout caller repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # actionlint のピンをここ 1 箇所に寄せる。
      #
      # `aqua i` は既定で「チェックアウトされているリポジトリの aqua.yaml」を読む。
      # そのため actionlint のピンだけが呼び出し側 6 箇所に散っていた（zizmor は
      # action の digest も version 入力もこのファイルが持っているのに）。実害も
      # 出ていて、aqua.yaml を持たないリポが新たにこのワークフローを呼ぶと
      # actionlint が PATH に無いまま `exit 127` だけ出して死ぬ
      # （talos-custom-build と、このリポ自身の初回がそれ）。
      #
      # ref は job.workflow_sha =「この reusable workflow が解決された commit」。
      # 呼び出し側が `@<sha>` でピンした版とツール設定が同一 commit で凍結される。
      #
      # sparse-checkout で設定 2 ファイルだけ取る。ワークフローまで持ってくると
      # actionlint が home-actions 自身の .github/workflows も検査対象にしてしまう。
      - name: Checkout lint tooling config
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Tsuguya-HC/home-actions
          ref: ${{ job.workflow_sha }}
          sparse-checkout: |
            aqua.yaml
            aqua-checksums.json
          sparse-checkout-cone-mode: false
          path: _tooling
          persist-credentials: false

      - uses: aquaproj/aqua-installer@96a9bc20066c5bf5e275b41019cfc165b25f4e2e # v4.0.5
        with:
          aqua_version: ${{ inputs.aqua-version }}
          # 既定の `-l` はリンクを張るだけで実体を落とさない。取得は後段の
          # run: で起きるが、そこには GITHUB_TOKEN が無く未認証になる。
          # ダウンロードを token のあるこのステップに寄せる。
          aqua_opts: ""

      - name: Lint workflows
        run: |
          set -euo pipefail
          # actionlint は shellcheck が無いと run: ブロックの検査を黙って飛ばす。
          # runner イメージから消えたときに「緑だが何も見ていない」に落ちないよう、
          # 存在確認で fail-closed にする。
          command -v shellcheck >/dev/null || {
            echo "::error::shellcheck is not on the runner; actionlint would skip every run: block"
            exit 1
          }
          actionlint -no-color

  zizmor:
    # Named so this repository passes the pedantic level it imposes on its
    # callers; the string matches the job id, so the check name callers see is
    # unchanged.
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@70fb788f84895a7701f5643d103d587e460b5c99 # v0.6.3
        with:
          version: ${{ inputs.zizmor-version }}
          # SARIF ではなく注釈で出す。どちらも指摘があれば job は赤になる
          # （action は zizmor の終了コードをそのまま返す）ので fail-closed 性は同じ。
          # 違うのは読み方で、注釈は `::error:: file:line message` としてログに
          # 直接出るぶん、CI を読むのが人でもエージェントでも扱いやすい。
          # SARIF を捨てると security-events: write が要らなくなり、
          # public/private で呼び出し側の権限を分ける必要もなくなる。
          advanced-security: "false"
          annotations: "true"
          # 既定の regular は 6 リポで指摘ゼロになってしまい、実質何も強制しない。
          # pedantic まで上げると concurrency の欠落・権限の無説明・
          # template 展開が出る。auditor との差は secrets-outside-env 1 件だけで、
          # 上げても ignore が要るものは無い（全リポで実測して確認済み）。
          persona: pedantic
