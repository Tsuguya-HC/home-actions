---
# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/aqua-yaml.json
#
# The single source for actionlint's pin, for every repository that calls
# lint-workflows.yml.
#
# It used to be resolved from the caller — `aqua i` reads the aqua.yaml of
# whichever repository is checked out — so the pin lived in six places and a
# caller without an aqua.yaml got a bare `exit 127` with no diagnostic.
# lint-workflows.yml now sparse-checks-out this file at job.workflow_sha and
# points AQUA_CONFIG at it, so the workflow and the tool it runs are frozen at
# the same commit as whatever SHA the caller pinned.
checksum:
  enabled: true
  # Fail rather than fall back to "just download it" when a checksum is missing.
  require_checksum: true
  # CI is linux/amd64; recording other platforms would only pad the lock file.
  supported_envs:
    - linux/amd64

registries:
  - type: standard
    ref: v4.556.0 # renovate: depName=aquaproj/aqua-registry

packages:
  - name: rhysd/actionlint@v1.7.12
